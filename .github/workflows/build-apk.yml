name: Build APK Nhan Vien V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'SaiGonDaNang_NhanVien_Android_IconV2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Giai nen ma nguon
        run: |
          unzip -o SaiGonDaNang_NhanVien_Android_IconV2.zip -d source

      - name: Build APK
        run: |
          gradle -p source/SaiGonDaNangNhanVienAndroid assembleDebug

      - name: Luu APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiGonDaNang-NhanVien-V2-APK
          path: source/SaiGonDaNangNhanVienAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
